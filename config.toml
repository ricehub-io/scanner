# Max uncompressed archive size that can be scanned
max_uncompressed_size = "100MB"

# What file extensions should be considered as a script
# (only scripts are statically analyzed)
shell_extensions = [
    ".sh",
    ".bash",
    ".zsh",
    ".fish",
    ".py",
    ".pl",
]

# Suspicious regexp patterns that should be detected
# when performing static analysis on a file
suspicious_patterns = [
    # common
    'curl\s+.*\|\s*(bash|sh)',
    'wget\s+.*\|\s*(bash|sh)',
    'rm\s+-rf\s+/',
    'chmod\s+777',
    '/etc/passwd',
    '/etc/shadow',
    'base64\s+--decode',
    'eval\s+\$\(',
    '>\s*/dev/sd',
    'mkfs',
    'dd\s+if=',
    'mount\s+',
    'umount\s+',

    # reverse shells & backdoors
    'nc\s+.*-e\s+(bash|sh)',
    'bash\s+-i\s+>&\s*/dev/tcp/',
    'sh\s+-i\s+>&\s*/dev/tcp/',
    'python\s+-c\s+.*socket',
    'perl\s+-e\s+.*socket',

    # download + execute
    'curl\s+.*-o\s+\S+\s*&&\s*(bash|sh)\s+\S+',
    'wget\s+.*-O\s+\S+\s*&&\s*(bash|sh)\s+\S+',

    # obfuscation & encoding things
    'base64\s+-d',
    'echo\s+.*\|\s*base64\s+-d',
    'printf\s+.*\|\s*base64\s+-d',
    'xxd\s+-r',
    'openssl\s+enc',
    '\$\{.*\}',

    # shell features
    'eval\s+',
    'exec\s+',
    'source\s+',
    '\.\s+\/',

    # privilege escalation & tampering
    'sudo\s+',
    'su\s+',
    'useradd',
    'usermod',
    'passwd',

    # persistence stuff
    'crontab',
    '/etc/cron',
    '~/.bashrc',
    '~/.profile',
    'systemctl\s+enable',

    # ssh backdoor injection
    'authorized_keys',
    'ssh-rsa',

    # file exfiltration & data theft
    'scp\s+',
    'rsync\s+',
    'nc\s+.*\d{2,5}',

    # fork bombs
    ':\(\)\s*\{\s*:\|\:&\s*\};:',

    # test pattern
    '(?i)X5O!P%@AP\[4PZX54\(P\^\)7CC\)7\}\$EICAR-STANDARD-ANTIVIRUS-TEST-FILE!\$H\+H\*',
]

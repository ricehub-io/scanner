name: CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Go tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install system dependencies
        run: sudo apt-get install -y libclamav-dev

      - name: Compile proto
        run: |
          sudo apt-get install -y protobuf-compiler
          make install-proto
          bash proto/compile.sh

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: make test

  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest
    needs: [test]
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install system dependencies
        run: sudo apt-get install -y libclamav-dev

      - name: Compile proto
        run: |
          sudo apt-get install -y protobuf-compiler
          make install-proto
          bash proto/compile.sh

      - name: Compile source code
        run: make build

      - name: Copy executable via SSH
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          source: "build/scanner"
          target: ${{ vars.VPS_TARGET_DIR }}
          strip_components: 1

      - name: Restart systemd service
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: sudo systemctl restart ricehub-file-scanner.service
